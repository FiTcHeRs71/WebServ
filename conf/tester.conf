# conf/tester.conf — config minimale pour le tester officiel 42 (tester/tester)
# Lancement : ./webserv conf/tester.conf   puis   ./tester/tester http://localhost:8080
#
# Le tester impose EXACTEMENT ce comportement (voir docs/webserv-mode-demploi.md §4) :
#   /            -> GET uniquement
#   *.bla        -> POST -> exécute le CGI ./tester/cgi_tester
#   /post_body   -> POST, client_max_body_size = 100
#   /directory/  -> GET, root = YoupiBanane, index youpi.bad_extension

server {
    listen                  0.0.0.0:8080;
    server_name             localhost;
    client_max_body_size    10000000;

    error_page 404          /errors/404.html;
    error_page 500 502 503  /errors/50x.html;

    # /  -> GET uniquement (racine du site de démo)
    location / {
        allow_methods       GET;
        root                ./www;
        index               index.html;
        autoindex           off;
    }

    # *.bla -> POST via le CGI officiel cgi_tester
    # (le serveur exécute ./tester/cgi_tester pour toute requête sur une URI en .bla)
    location ~ \.bla$ {
        allow_methods       POST;
        root                ./www;
        cgi_ext             .bla;
        cgi_pass            ./tester/cgi_tester;
    }

    # /post_body -> POST, corps limité à 100 octets (au-delà : 413)
    location /post_body {
        allow_methods       POST;
        root                ./www;
        client_max_body_size 100;
    }

    # /directory/ -> GET, root = YoupiBanane, index youpi.bad_extension
    location /directory/ {
        allow_methods       GET;
        root                ./YoupiBanane;
        index               youpi.bad_extension;
        autoindex           on;
    }
}
