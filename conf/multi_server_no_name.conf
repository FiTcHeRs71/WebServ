# CAS VALIDE : deux serveurs sans server_name sur un meme host:port
# Aucun des deux blocs n'a de server_name. Ils ne sont pas en conflit de nom :
# le premier declare devient le serveur par defaut du couple 0.0.0.0:8080, le
# second est simplement inatteignable tant qu'aucun default_server n'est pose
# (voir docs/webserv-listen-nginx-design.md, section 5).
# ATTENDU : la config est acceptee (exit(0)).

server
{
	listen					0.0.0.0:8080;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

server
{
	listen					0.0.0.0:8080;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
