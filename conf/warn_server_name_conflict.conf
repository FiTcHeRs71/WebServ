# CAS VALIDE : conflit de server_name sur un meme host:port
# Deux blocs server ecoutent sur le meme couple host:port et partagent le
# server_name "a.com". NGINX ne rejette pas cette conf : il emet un warning et
# garde le premier bloc declare, les suivants ne recevront jamais de requete
# pour ce nom (voir docs/webserv-listen-nginx-design.md, section 5).
# ATTENDU : la config est acceptee (exit(0)), avec sur stderr
#           webserv: [warn] conflicting server name "a.com" on 0.0.0.0:8080, ignored
# Pour designer explicitement le gagnant, utiliser le parametre default_server.

server
{
	listen					0.0.0.0:8080;
	server_name				a.com;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

server
{
	listen					0.0.0.0:8080;
	server_name				a.com;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
