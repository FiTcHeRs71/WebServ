#DEFAULT CONFIGURE FILE FOR WEBSERV
#ON doit ajouter des location pour chaque page que notre site veux contenir

#USAGE :
# Ajouter une location si une famille d'URL doit avoir un comportement different que celui deja en place
# exemple : location / -> allow_methods = GET | location /upload (localhost:8080/upload) allow_methods = GET POST
# exemple 2 : location / root = ./www | location /downloads root = ./ fducrot/telechargement
# voir autre exemple dans docs/webserv-fichier-conf.md

# LISTEN (A-07) : formes acceptees, alignees sur NGINX
# https://nginx.org/en/docs/http/ngx_http_core_module.html#listen
# Regle de lecture : un token entierement numerique est un PORT, sinon une ADRESSE.
# Les formes sans port explicite prennent DEFAULT_PORT (80).

server
{
	listen					0.0.0.0:8080;	# adresse:port
	listen					8081;			# port seul       -> 0.0.0.0:8081
	listen					*:9090;			# wildcard:port   -> 0.0.0.0:9090
	listen					localhost:7070;	# hostname resolu -> 127.0.0.1:7070
	listen					127.0.0.1;		# adresse seule   -> 127.0.0.1:80
	listen					*;				# wildcard seul   -> 0.0.0.0:80
	server_name				webserv;
	client_max_body_size	10M;

	error_page 404			/errors/404.html;
	error_page 500			/errors/500.html;
	error_page 502			/errors/502.html;
	error_page 503			/errors/503.html;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

# Deux blocs server peuvent partager le meme couple host:port tant que leurs
# server_name different : c'est le virtual host.

server
{
	listen			0.0.0.0:8080;
	server_name		webserv2;
}
