#DEFAULT CONFIGURE FILE FOR WEBSERV
#ON doit ajouter des location pour chaque page que notre site veux contenir

#USAGE :
# Ajouter une location si une famille d'URL doit avoir un comportement different que celui deja en place
# exemple : location / -> allow_methods = GET | location /upload (localhost:8080/upload) allow_methods = GET POST
# exemple 2 : location / root = ./www | location /downloads root = ./ fducrot/telechargement
# voir autre exemple dans docs/webserv-fichier-conf.md

# LISTEN (A-07) : formes acceptees, alignees sur NGINX
# https://nginx.org/en/docs/http/ngx_http_core_module.html#listen
# Regle de lecture : un token entierement numerique est un PORT, sinon une ADRESSE.
# Les formes sans port explicite prennent DEFAULT_PORT (80).
#
# Deux formes valides ne sont PAS exercees ici, volontairement :
#   listen 127.0.0.1;   # adresse seule  -> 127.0.0.1:80
#   listen *;           # wildcard seul  -> 0.0.0.0:80
# Elles sont acceptees par le parseur, mais inutilisables dans cette conf :
#   1. le port 80 est privilegie, le bind() echoue sans les droits root ;
#   2. elles visent le meme port, donc elles s'excluent mutuellement (voir
#      la regle du wildcard ci-dessous).
# Cette conf doit demarrer sans privileges : elle reste sur des ports > 1024.
#
# REGLE DU WILDCARD : 0.0.0.0 couvre toutes les interfaces d'un port. Sur un
# meme port, on ne peut donc pas avoir a la fois 0.0.0.0 et une adresse
# precise -- le noyau refuse le second bind() (EADDRINUSE), meme avec
# SO_REUSEADDR, et quel que soit l'ordre de declaration. En revanche deux
# adresses precises distinctes cohabitent sans probleme sur un meme port.
# Cas invalide illustre dans conf/bad/34_listen_wildcard_conflict.conf.

server
{
	listen					0.0.0.0:8080;	# adresse:port
	listen					8081;			# port seul       -> 0.0.0.0:8081
	listen					*:9090;			# wildcard:port   -> 0.0.0.0:9090
	listen					localhost:7070;	# hostname resolu -> 127.0.0.1:7070
	server_name				webserv;
	client_max_body_size	10M;

	error_page 404			/errors/404.html;
	error_page 500			/errors/500.html;
	error_page 502			/errors/502.html;
	error_page 503			/errors/503.html;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}

	# CGI (D-01) : toute URI sous /cgi-bin se terminant par .py est passee a
	# l'interpreteur declare par cgi_pass, au lieu d'etre servie en statique.
	# cgi_pass doit designer un binaire executable ; le script, lui, n'a pas
	# besoin du bit x puisque c'est python3 qui le lit.
	location /cgi-bin
	{
		allow_methods		GET POST;
		root				./www;
		cgi_ext				.py;
		cgi_pass			/usr/bin/python3;
	}
}

# Deux blocs server peuvent partager le meme couple host:port tant que leurs
# server_name different : c'est le virtual host.

server
{
	listen			0.0.0.0:8080;
	server_name		webserv2;
}
