#FICHIER DE CONF DEDIE AUX TESTS DE Resolve() ET build_path()
#Les locations se chevauchent volontairement : c'est ce qui permet de verifier
#le match du prefixe le plus long et la frontiere de segment.
#Utilise par tests/test_resolve.sh

server
{
	listen					0.0.0.0:8080;
	server_name				webserv;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}

	location /kap
	{
		allow_methods		GET;
		root				/tmp/kap;
	}

	location /kapouet
	{
		allow_methods		GET;
		root				/tmp/www;
	}

	location /images/
	{
		allow_methods		GET;
		root				/tmp/img/;
	}
}
