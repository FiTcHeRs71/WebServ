# conf/autoindex.conf — config de dev pour C-07, pas utilisée par le tester 42
server {
    listen                  0.0.0.0:8080;
    server_name             localhost;
    client_max_body_size    10000000;

    error_page 404          /errors/404.html;

    location / {
        allow_methods       GET;
        root                ./www;
        index               index.html;
        autoindex           off;
    }

    # autoindex on, aucune directive index -> le listing doit sortir
    location /listing/ {
        allow_methods       GET;
        root                ./YoupiBanane;
        autoindex           on;
    }

    # même dossier, autoindex off -> doit rendre 403
    location /refuse/ {
        allow_methods       GET;
        root                ./YoupiBanane;
        autoindex           off;
    }
}