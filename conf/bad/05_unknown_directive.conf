# CAS INVALIDE : directive inconnue
# "lisen" n'existe pas dans la grammaire du .conf (typo sur "listen").
# ATTENDU : le parseur doit détecter le mot-clé non reconnu et rejeter
#           la config avec un message clair, sans crasher (exit(1)).

server
{
	lisen					0.0.0.0:8080;
	server_name				webserv;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}