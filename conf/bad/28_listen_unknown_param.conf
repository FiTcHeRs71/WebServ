# CAS INVALIDE : parametre listen inexistant
# "nawak" n'existe ni dans webserv ni dans NGINX : c'est une faute de frappe,
# pas une limite assumee. Pendant du cas 27, qui verifie l'autre branche du
# diagnostic.
# ATTENDU : le parseur doit rejeter avec un message distinct de celui du cas 27
#           ("unknown listen parameter \"nawak\""), sans crasher (exit(1)).

server
{
	listen					8080 nawak;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
