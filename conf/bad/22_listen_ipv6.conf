# CAS INVALIDE : adresse IPv6
# Les adresses IPv6 entre crochets sont une forme NGINX valide, mais webserv
# ne gere que l'IPv4 (voir docs/webserv-listen-nginx-design.md, section 1).
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("IPv6 is not supported by webserv"), sans crasher (exit(1)).

server
{
	listen					[::]:8080;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
