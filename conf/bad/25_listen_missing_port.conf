# CAS INVALIDE : port manquant apres le ":"
# "listen 127.0.0.1;" est valide (port implicite 80), mais le ":" ecrit sans
# port derriere est une directive incomplete.
# ATTENDU : le parseur doit rejeter la config, sans crasher (exit(1)).

server
{
	listen					127.0.0.1:;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
