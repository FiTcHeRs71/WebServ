# CAS INVALIDE : plusieurs ":" dans le token listen
# Aucune forme supportee par webserv ne contient deux ":" (l'IPv6, qui en
# contient, est rejetee plus tot par le test sur "[").
# ATTENDU : le parseur doit rejeter la config, sans crasher (exit(1)).

server
{
	listen					1:2:3;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
