# CAS INVALIDE : conflit de server_name sur un meme host:port
# Deux blocs server ecoutent sur le meme couple host:port et partagent
# le server_name "a.com" : impossible de decider lequel doit repondre a
# une requete avec "Host: a.com".
# ATTENDU : le parseur doit detecter le conflit et rejeter la config
#           avec un message clair, sans crasher (exit(1)).

server
{
	listen					0.0.0.0:8080;
	server_name				a.com;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

