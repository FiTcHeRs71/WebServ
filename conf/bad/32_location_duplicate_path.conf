# CAS INVALIDE : meme PATH de location declare deux fois dans un bloc server
# Piege : le squelette se parse sans erreur, mais Resolve() compare les
# longueurs de prefixe avec un '>' strict : c'est la PREMIERE location qui
# gagne. Le second bloc est donc mort silencieusement, et un root corrige
# dedans n'aurait aucun effet.
# A ne pas confondre avec deux blocs server declarant chacun "location /" :
# ca, c'est valide, la portee du doublon est le bloc server.
# "/foo" et "/foo/" restent deux paths DISTINCTS (comme chez NGINX), donc
# eux aussi sont valides ensemble.
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("duplicate location \"/foo\" in server block"), sans crasher (exit(1)).

server
{
	listen					8080;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}

	location /foo
	{
		allow_methods		GET;
		root				./www/a;
		index				index.html;
	}

	location /foo
	{
		allow_methods		GET;
		root				./www/b;
		index				index.html;
	}
}
