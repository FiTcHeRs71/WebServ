# CAS INVALIDE : listen duplique dans un meme bloc server
# Le meme couple host:port est declare deux fois. Les deux ecritures
# sont equivalentes : "8080" est normalise en "0.0.0.0:8080".
# ATTENDU : le parseur doit detecter le doublon et rejeter la config
#           avec un message clair, sans crasher (exit(1)).

server
{
	listen					0.0.0.0:8080;
	listen					8080;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
