# CAS INVALIDE : modifier NGINX devant le PATH d'une location
# NGINX accepte "= /x" (match exact), "~" / "~*" (regex), "^~" (prefixe
# prioritaire) et "@nom" (location nommee). Notre parseur ne les implemente
# PAS : choix assume, le sujet ne les demande pas et notre CGI passe par
# cgi_ext / cgi_pass plutot que par un "location ~ \.php$".
# Piege : le cas etait deja rejete, mais par accident ("= is not a valid
# PATH", parce que le token ne contient pas de '/'). Le refus doit etre
# explicite et nomme, pas un effet de bord.
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("location modifiers (=, ~, ~*, ^~, @) are not supported"),
#           sans crasher (exit(1)).

server
{
	listen					8080;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}

	location = /exact
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
