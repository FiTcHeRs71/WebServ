# CAS INVALIDE : adresse manquante avant le ":"
# Piege : une adresse vide est une valeur legitime en interne (elle signifie
# "toutes les interfaces", produite par "listen 8080;"). Ecrite explicitement
# avec un ":", elle doit etre refusee, comme le fait NGINX.
# ATTENDU : le parseur doit rejeter la config, sans crasher (exit(1)).

server
{
	listen					:8080;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
