# CAS INVALIDE : socket UNIX
# "unix:/chemin" est une forme NGINX valide, mais webserv n'ecoute que sur
# des sockets TCP/IPv4 (voir docs/webserv-listen-nginx-design.md, section 1).
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("unix sockets are not supported by webserv"), sans crasher (exit(1)).

server
{
	listen					unix:/tmp/webserv.sock;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
