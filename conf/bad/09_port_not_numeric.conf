# CAS INVALIDE : port non numeric
# Le port contient des caractere non numeric
# ATTENDU : le parseur doit détecter le port invalid et rejeter
#           la config avec un message clair, sans crasher (exit(1)).

server
{
	listen					0.0.0.0:abcd;
	server_name				webserv;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}