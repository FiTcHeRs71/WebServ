# CAS INVALIDE : port hors borne
# Le port 70000 dépasse le maximum autorisé (65535, encodage 16 bits).
# ATTENDU : le parseur doit détecter le port hors borne et rejeter
#           la config avec un message clair, sans crasher (exit(1)).

server
{
	listen					0.0.0.0:70000;
	server_name				webserv;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}