# CAS INVALIDE : le wildcard 0.0.0.0 et une adresse precise sur le MEME port
# 0.0.0.0 designe toutes les interfaces : il couvre deja 127.0.0.1. Le noyau
# refuse donc le second bind() avec EADDRINUSE, meme avec SO_REUSEADDR pose
# sur les deux sockets, et QUEL QUE SOIT l'ordre de declaration (verifie :
# wildcard puis precise, et precise puis wildcard, echouent identiquement).
# Rappel : SO_REUSEADDR ne leve pas cette exclusion (il sert surtout a
# rebinder un port en TIME_WAIT). Seul SO_REUSEPORT le permettrait, mais il
# ferait repartir les connexions par le noyau entre les deux sockets, ce qui
# n'est pas le comportement voulu -- on ne l'utilise pas.

server
{
	listen					*:8080;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

server
{
	listen					127.0.0.1:8080;
	server_name				webserv2;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
