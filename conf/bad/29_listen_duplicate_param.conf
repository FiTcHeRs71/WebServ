# CAS INVALIDE : parametre default_server repete sur la meme directive
# ATTENDU : le parseur doit rejeter la config, sans crasher (exit(1)).

server
{
	listen					8080 default_server default_server;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
