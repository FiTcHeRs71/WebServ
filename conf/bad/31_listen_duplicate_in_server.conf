# CAS INVALIDE : meme point d'ecoute declare deux fois dans un bloc server
# Piege : "8080" et "0.0.0.0:8080" ne s'ecrivent pas pareil mais designent le
# MEME socket, car un token entierement numerique est un port et l'adresse
# absente vaut 0.0.0.0. C'est ce que compare l'operator== de TListenConfig,
# qui ne regarde que Host et Port.
# A ne pas confondre avec deux blocs server partageant un listen : ca, c'est le
# virtual host, et c'est valide (voir conf/warn_server_name_conflict.conf).
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("duplicated listen 0.0.0.0:8080"), sans crasher (exit(1)).

server
{
	listen					8080;
	listen					0.0.0.0:8080;
	server_name				a.com;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
