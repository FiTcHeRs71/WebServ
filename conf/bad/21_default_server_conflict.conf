# CAS INVALIDE : deux serveurs par defaut sur un meme host:port
# Aucun des deux blocs n'a de server_name : les deux pretendent etre le
# serveur par defaut du couple 0.0.0.0:8080, il n'y a aucun moyen de les
# departager sur l'en-tete Host.
# ATTENDU : le parseur doit detecter le conflit et rejeter la config
#           avec un message clair, sans crasher (exit(1)).

server
{
	listen					0.0.0.0:8080;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

