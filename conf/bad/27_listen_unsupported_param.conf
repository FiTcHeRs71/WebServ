# CAS INVALIDE : parametre listen hors perimetre
# "ssl" est un parametre NGINX parfaitement valide, mais webserv ne gere que
# "default_server" (voir docs/webserv-listen-nginx-design.md, section 1).
# Ce cas est distinct d'une faute de frappe : le message doit dire que le
# parametre existe mais n'est pas supporte, pas qu'il est inconnu.
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("listen parameter \"ssl\" is not supported by webserv"),
#           sans crasher (exit(1)).

server
{
	listen					8080 ssl;
	server_name				webserv;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
