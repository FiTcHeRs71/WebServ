# CAS INVALIDE : directive sans valeur
# "listen" est un mot-clé valide, mais aucune valeur ne suit avant le ';'.
# ATTENDU : le parseur doit détecter la valeur manquante et rejeter
#           la config avec un message clair, sans crasher (exit(1)).

server
{
	listen					;
	server_name				webserv;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}