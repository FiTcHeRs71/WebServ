# CAS INVALIDE : deux default_server sur un meme couple host:port
# Le parametre default_server designe le serveur qui repond aux requetes dont
# l'en-tete Host ne correspond a aucun server_name du groupe. Il ne peut y en
# avoir qu'un par socket (voir docs/webserv-listen-nginx-design.md, section 5).
# Sans server_name en commun, les deux blocs seraient parfaitement valides :
# c'est le default_server duplique qui est fautif, pas le listen partage.
# ATTENDU : le parseur doit rejeter avec un message nomme
#           ("duplicate default server for 0.0.0.0:8080"), sans crasher (exit(1)).

server
{
	listen					8080 default_server;
	server_name				a.com;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

server
{
	listen					8080 default_server;
	server_name				b.com;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}
