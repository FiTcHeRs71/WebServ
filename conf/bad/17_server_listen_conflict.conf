# CAS INVALIDE : cgi_ext sans cgi_pass
# La location déclare "cgi_ext .py" mais ne fournit aucun "cgi_pass",
# donc pas d'interpréteur pour exécuter ces fichiers.
# ATTENDU : le parseur doit détecter l'incohérence et rejeter
#           la config avec un message clair, sans crasher (exit(1)).

server
{
	listen					0.0.0.0:8080;
	server_name				webserv;
	client_max_body_size	10M;

	location /cgi-bin
	{
		allow_methods		GET POST;
		root				./www;
		cgi_ext				.py;
	}
}
