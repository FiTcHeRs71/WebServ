# CAS INVALIDE : deux blocs "server" sur le meme couple ip:port
# Deux "server{}" distincts déclarent tous les deux "listen 0.0.0.0:8080",
# donc deux sites qui revendiquent la même adresse d'écoute.
# ATTENDU : le parseur doit détecter le conflit entre les deux blocs
#           server et rejeter la config avec un message clair,
#           sans crasher (exit(1)).


server
{
	listen					0.0.0.0:8080;
	server_name				webserv;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www;
		index				index.html;
	}
}

server
{
	listen					0.0.0.0:8080;
	server_name				webserv2;
	client_max_body_size	10M;

	location /
	{
		allow_methods		GET;
		root				./www2;
		index				index.html;
	}
}
